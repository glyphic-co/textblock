name: Build & Publish
on:
    push:
        branches: "**"
    pull_request:
        types: [closed]
        branches: [development, master]
        paths-ignore:
            - "**/*"
env:
    HUSKY: "0"
jobs:
    build:
        runs-on: ubuntu-latest
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.merged) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Build
              run: |
                  npm install
                  npm run build
